# Production overrides (live demo VM): use the shared MySQL on the "portfolio"
# network and only listen on localhost, behind a reverse proxy that handles HTTPS.
services:
  app:
    environment:
      DB_HOST: mysql
      ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: !override
      - "127.0.0.1:5101:5000"
    depends_on: !reset []
    networks: [portfolio]

  db:
    profiles: ["local-db"]   # not started in production

networks:
  portfolio:
    external: true
